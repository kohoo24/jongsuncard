<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1310">
<meta name="description" content="AI 상대와 혼자 즐기는 노리밋 텍사스 홀덤">
<title>텍사스 홀덤</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>♠</text></svg>">
<link rel="stylesheet" href="css/font.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" data-four-color="false">
  <header class="topbar">
    <div class="brand"><span class="pip">&spades;</span> <span data-i18n="app.title">텍사스 홀덤</span></div>
    <div class="meta" id="topMeta"></div>
    <div class="topbtns">
      <button class="ghost" id="btnUnit" aria-pressed="false" title="금액 단위 전환">bb</button>
      <button class="ghost" id="btnSound" aria-pressed="true" title="소리">&#128266;</button>
      <button class="ghost coach-btn" id="btnCoach" disabled title="생각 정리" aria-pressed="false">&#128161;<span class="txt" data-i18n="coach.btnShort">생각 정리</span></button>
      <button class="ghost" id="btnPanel" aria-expanded="true" data-i18n="top.log">기록</button>
      <button class="ghost" id="btnMenu" data-i18n="top.home">홈</button>
    </div>
  </header>

  <main class="stage">
    <div class="rail">
    <div class="felt" id="felt">
      <div class="table-center">
        <div class="pots" id="pots" aria-live="polite"></div>
        <div class="community" id="community" role="list" aria-label="커뮤니티 카드"></div>
        <div class="street-label" id="streetLabel"></div>
      </div>
      <div class="deck" id="deckSpot" aria-hidden="true"></div>
      <div class="seats" id="seats"></div>
      <div class="chip-layer" id="chipLayer" aria-hidden="true"></div>
      <div class="result-banner" id="resultBanner" role="status"></div>
    </div>
    </div>

    <aside class="side" id="sidePanel" aria-label="정보 패널">
      <nav class="tabs" role="tablist">
        <button class="tab on" data-tab="log" role="tab" aria-selected="true" data-i18n="tab.log">현재 핸드</button>
        <button class="tab" data-tab="review" role="tab" aria-selected="false" data-i18n="tab.review">리뷰</button>
        <button class="tab" data-tab="chart" role="tab" aria-selected="false" data-i18n="tab.chart">레인지</button>
        <button class="tab" data-tab="stats" role="tab" aria-selected="false" data-i18n="tab.stats">세션</button>
        <button class="tab" data-tab="learn" role="tab" aria-selected="false" data-i18n="tab.learn">훈련</button>
      </nav>
      <div class="tab-body" id="tabBody" role="tabpanel" aria-live="polite"></div>
    </aside>
  </main>

  <section class="controls">
    <div class="hero-readout" id="heroReadout"></div>
    <div class="street-summary" id="streetSummary" aria-live="polite"></div>

    <div class="action-area">
      <div class="drill-hint hidden" id="drillHint" aria-live="polite"></div>
      <div class="coach-box hidden" id="coachBox" aria-live="polite"></div>
      <div class="btn-row" id="btnRow">
        <button class="act danger" id="btnFold"><span></span><kbd>F</kbd></button>
        <button class="act" id="btnCall"><span></span><kbd>C</kbd></button>
        <button class="act gold" id="btnRaise"><span></span><kbd>R</kbd></button>
      </div>

      <div class="raise-row" id="raiseRow">
        <input type="range" id="raiseSlider" aria-label="레이즈 금액">
        <label class="raise-input-wrap"><input type="number" id="raiseInput" inputmode="decimal" aria-label="레이즈 금액 직접 입력" min="0" step="any"><span id="raiseUnit" class="raise-unit hidden">bb</span></label>
        <div class="presets" id="presets" role="group" aria-label="스마트 벳"></div>
      </div>

      <div class="btn-row" id="showRow">
        <button class="act" id="btnShow" data-i18n="ctl.showCards">카드 공개</button>
        <button class="act" id="btnMuck" data-i18n="ctl.muckCards">머크</button>
      </div>

      <div class="waiting" id="waiting" aria-live="polite"></div>
      <div class="btn-row" id="addonRow">
        <button class="act gold" id="btnAddon" data-i18n="tour.addonPlain">애드온</button>
        <button class="act" id="btnAddonSkip" data-i18n="common.no">아니오</button>
      </div>
      <div class="drill-row hidden" id="drillRow">
        <div class="drill-feedback hidden" id="drillFeedback" aria-live="polite"></div>
        <div class="btn-row">
          <button class="act ghost-btn" id="btnDrillQuit" data-i18n="drill.quit">드릴 종료</button>
          <button class="act next hidden" id="btnDrillNext"><span data-i18n="drill.next">다음 문제</span><kbd>Space</kbd></button>
        </div>
      </div>
      <div class="btn-row" id="nextRow">
        <button class="act ghost-btn" id="btnReview" data-i18n="review.title">핸드 리뷰</button>
        <button class="act next" id="btnNext"><span data-i18n="ctl.nextHand">다음 핸드</span><kbd>Space</kbd></button>
      </div>
    </div>
  </section>
</div>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<!-- 홈: 플레이와 교육 -->
<div class="modal" id="homeModal" role="dialog" aria-modal="true" aria-labelledby="homeTitle">
  <div class="modal-box wide home-box">
    <h2 id="homeTitle"><span class="pip">&spades;</span> <span data-i18n="app.title">텍사스 홀덤</span></h2>
    <p class="sub" data-i18n="app.subtitle"></p>
    <div class="home-grid">
      <section class="home-card play" aria-labelledby="homePlayTitle">
        <h3 id="homePlayTitle" data-i18n="home.play">플레이</h3>
        <p class="home-desc" data-i18n="home.playDesc"></p>
        <button class="act gold big" id="btnHomePlay" data-i18n="home.newGame">새 게임</button>
        <button class="act big" id="btnHomeResume" data-i18n="home.resume" hidden>이어하기</button>
      </section>
      <section class="home-card learn" aria-labelledby="homeLearnTitle">
        <h3 id="homeLearnTitle" data-i18n="home.learn">교육</h3>
        <p class="home-desc" data-i18n="home.learnDesc"></p>
        <div class="home-style" id="homeStyle"></div>
        <div id="homeDrill"></div>
        <button class="act gold big" id="btnHomeDaily"></button>
        <div class="btn-row home-row">
          <button class="act" id="btnHomeDrillWeak" data-i18n="home.drillWeak">약점 드릴</button>
          <button class="act" id="btnHomeDrillAny" data-i18n="home.drillAny">무작위 드릴</button>
        </div>
        <button class="act ghost-btn small" id="btnHomeLearn" data-i18n="home.learnStatus">학습 현황</button>
      </section>
    </div>
  </div>
</div>

<!-- 학습 현황 (홈에서 여는 전체 화면) -->
<div class="modal" id="learnModal" role="dialog" aria-modal="true" aria-labelledby="learnTitle">
  <div class="modal-box wide">
    <button class="modal-x" id="btnLearnX" type="button" tabindex="-1" aria-label="닫기">&times;</button>
    <h2 id="learnTitle" data-i18n="learn.status">학습 현황</h2>
    <div id="learnBody" class="scroll-body learn-body"></div>
    <button class="act big" id="btnLearnClose" data-i18n="common.close">닫기</button>
  </div>
</div>

<!-- 설정 -->
<div class="modal" id="setupModal" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
  <div class="modal-box wide">
    <button class="modal-x" id="btnSetupX" type="button" tabindex="-1" aria-label="닫기">&times;</button>
    <h2 id="setupTitle"><span class="pip">&spades;</span> <span data-i18n="app.title">텍사스 홀덤</span></h2>
    <p class="sub" data-i18n="app.subtitle"></p>

    <div class="field-grid">
      <label class="field"><span data-i18n="setup.opponents"></span>
        <select id="optBots"></select></label>
      <label class="field"><span data-i18n="setup.difficulty"></span>
        <select id="optDifficulty"></select></label>
      <label class="field"><span data-i18n="setup.startChips"></span>
        <select id="optChips"></select></label>
      <label class="field"><span data-i18n="setup.mode"></span>
        <select id="optMode"></select></label>
    </div>

    <details class="setup-adv" id="setupAdvanced">
      <summary data-i18n="setup.advanced">고급 설정</summary>
      <div class="field-grid">
        <label class="field"><span data-i18n="setup.blinds"></span>
          <select id="optBlinds"></select></label>
        <label class="field"><span data-i18n="setup.structure"></span>
          <select id="optStructure"></select></label>
        <label class="field"><span data-i18n="setup.ante"></span>
          <select id="optAnte"></select></label>
        <label class="field"><span data-i18n="setup.speed"></span>
          <select id="optSpeed"></select></label>
        <label class="field"><span data-i18n="setup.clock"></span>
          <select id="optClock"></select></label>
        <label class="field"><span data-i18n="setup.language"></span>
          <select id="optLang"></select></label>
        <label class="field"><span data-i18n="setup.seed"></span>
          <input type="text" id="optSeed" placeholder="—" maxlength="10"></label>
      </div>
      <p class="hint" data-i18n="setup.seedHint"></p>
      <div class="check-grid">
        <label class="field check"><input type="checkbox" id="optReviewTab"><span data-i18n="setup.reviewTab"></span></label>
        <label class="field check"><input type="checkbox" id="optFourColor"><span data-i18n="setup.fourColor"></span></label>
        <label class="field check"><input type="checkbox" id="optUnitBb"><span data-i18n="setup.unitBb"></span></label>
        <label class="field check"><input type="checkbox" id="optRebuy"><span data-i18n="setup.rebuy"></span></label>
      </div>
    </details>

    <button class="act gold big" id="btnStart" data-i18n="setup.start">게임 시작</button>
    <button class="act ghost-btn small" id="btnResume" hidden>이어하기</button>
    <button class="act ghost-btn small" id="btnDrillFromSetup" data-i18n="setup.drill">약점 드릴</button>
    <button class="act ghost-btn small" id="btnSetupHome" data-i18n="setup.back">← 홈</button>
    <p class="hint" data-i18n="setup.shortcuts"></p>
  </div>
</div>

<!-- 게임 종료 -->
<div class="modal" id="overModal" role="dialog" aria-modal="true" aria-labelledby="overTitle">
  <div class="modal-box">
    <h2 id="overTitle"></h2>
    <p class="sub" id="overText"></p>
    <div id="overStats"></div>
    <button class="act gold big" id="btnOverRestart" data-i18n="over.restart">다시 시작</button>
    <button class="act big" id="btnRebuy" data-i18n="over.rebuyPlain" hidden>리바이</button>
  </div>
</div>

<!-- 핸드 리뷰 -->
<div class="modal" id="reviewModal" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
  <div class="modal-box wide">
    <button class="modal-x" id="btnReviewX" type="button" tabindex="-1" aria-label="닫기">&times;</button>
    <h2 id="reviewTitle" data-i18n="review.title">핸드 리뷰</h2>
    <div id="reviewBody" class="scroll-body"></div>
    <button class="act big" id="btnReviewClose" data-i18n="common.close">닫기</button>
  </div>
</div>

<!-- 리플레이 -->
<div class="modal" id="replayModal" role="dialog" aria-modal="true" aria-labelledby="replayTitle">
  <div class="modal-box wide">
    <button class="modal-x" id="btnReplayX" type="button" tabindex="-1" aria-label="닫기">&times;</button>
    <div id="replayBody" class="scroll-body"></div>
    <button class="act big" id="btnReplayClose" data-i18n="hist.close">닫기</button>
  </div>
</div>

<script src="js/cards.js"></script>
<script src="js/cardart.js"></script>
<script src="js/i18n.js"></script>
<script src="js/format.js"></script>
<script src="js/rng.js"></script>
<script src="js/evaluator.js"></script>
<script src="js/ranges.js"></script>
<script src="js/preflop-table.js"></script>
<script src="js/preflop.js"></script>
<script src="js/equity.js"></script>
<script src="js/stats.js"></script>
<script src="js/tournament.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/review.js"></script>
<script src="js/profile.js"></script>
<script src="js/style.js"></script>
<script src="js/drill.js"></script>
<script src="js/history.js"></script>
<script src="js/storage.js"></script>
<script src="js/panels.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
