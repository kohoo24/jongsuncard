name: Pages

# 기본 브랜치에 푸시될 때만 배포한다. 브랜치 이름을 여기에 박아 두면 기본 브랜치를
# 바꾸거나 이름을 고칠 때마다 배포가 조용히 멈춘다 — 저장소 설정의 기본 브랜치를 따른다.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # 배포는 한 번에 하나만. 밀린 건 최신 것만 남긴다.
    # (워크플로 수준에 두면 다른 브랜치의 건너뛴 실행이 진행 중인 배포를 취소한다)
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: 배포할 것만 추린다
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest icon.svg sw.js site/
          cp -r css js fonts icons site/
          # 서비스 워커가 미리 받는 파일이 하나라도 빠지면 옛 캐시에 갇힌다 — 여기서 막는다
          for f in $(grep -oE "'\./[^']+'" site/sw.js | tr -d "'" | grep -v '^\./$'); do
            [ -f "site/$f" ] || { echo "::error::sw.js 가 캐시하는 $f 가 배포에 없다"; exit 1; }
          done
          # 서브경로(/jongsuncard/)에서도 돌아가도록 전부 상대경로여야 한다
          if grep -rnE '(href|src)="/|url\("/' site/index.html site/css site/js; then
            echo '::error::절대경로가 있다 — 서브경로 배포에서 깨진다'
            exit 1
          fi

      - name: 캐시 이름에 빌드 스탬프를 박는다
        run: |
          # 이게 안 되면 예전 캐시가 영영 안 지워진다 — 조용히 넘어가지 않는다
          sed -i "s/^const BUILD = 'dev';$/const BUILD = '${GITHUB_SHA}';/" site/sw.js
          grep -q "const BUILD = '${GITHUB_SHA}';" site/sw.js \
            || { echo '::error::sw.js 의 BUILD 를 바꾸지 못했다'; exit 1; }

      - name: Jekyll 을 거치지 않게 한다
        run: touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
