name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 린트
        run: npx --yes eslint js sw.js test tools
      - name: 단위 테스트
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright 설치
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: 브라우저 E2E
        run: npm run test:e2e
      - name: 서비스 워커 갱신
        run: npm run test:sw
